services:
  db:
    image: postgres:16
    container_name: srb-postgres
    environment:
      POSTGRES_USER: srb
      POSTGRES_PASSWORD: srb
      POSTGRES_DB: srb
    ports:
      - "127.0.0.1:5432:5432"     # solo accesible desde esta máquina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srb -d srb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
